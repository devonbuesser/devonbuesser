<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- userSpaceOnUse is required for gradients on text elements -->
    <linearGradient id="title-grad" x1="200" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="14" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Decorative accent line -->
  <rect x="360" y="130" width="80" height="2" rx="1" fill="#58a6ff" opacity="0.5"/>

  <!-- Title -->
  <text
    x="400" y="65"
    text-anchor="middle"
    fill="url(#title-grad)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="32"
    font-weight="700"
  >Hi, I&apos;m devOn</text>

  <!-- Subtitle -->
  <text
    x="400" y="98"
    text-anchor="middle"
    fill="#8b949e"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="400"
  >Software Developer | Automation &amp; Embedded Systems</text>

  <!-- Location / URL -->
  <text
    x="400" y="123"
    text-anchor="middle"
    fill="#58a6ff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    opacity="0.85"
  >Switzerland &#x2022; devonbuesser.pages.dev</text>
</svg>
